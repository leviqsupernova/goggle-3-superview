name: ui-screenshots

# The WPF UI cannot run on the Linux dev box: render it here and keep PNGs of its main states.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Windows/Goggles3.Windows/**'
      - 'Windows/scripts/**'
      - '.github/workflows/ui-screenshots.yml'

jobs:
  screenshots:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish (same script as a release)
        shell: pwsh
        run: ./Windows/scripts/Publish.ps1 -Runtime win-x64
      - name: Capture
        shell: pwsh
        run: ./Windows/scripts/Capture-Screens.ps1 -App "outputs/Goggle-3-LiveView-Windows-x64/Goggle 3 LiveView.exe" -Out screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots
