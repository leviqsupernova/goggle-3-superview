name: release

# Push a tag like v0.4.0 to build the Windows zip and attach it to a GitHub release (draft until you publish it).
# "Run workflow" builds the zip only and keeps it as an artifact.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request: # packaging changes get a test build
    paths: ['Windows/scripts/Publish.ps1', '.github/workflows/release.yml']

permissions:
  contents: write

jobs:
  zip:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish (tests + self-contained build + zip)
        shell: pwsh
        run: ./Windows/scripts/Publish.ps1 -Runtime win-x64 -Zip
      - uses: actions/upload-artifact@v4
        with:
          name: Goggle-3-LiveView-Windows-x64
          path: outputs/Goggle-3-LiveView-Windows-x64.zip
      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" outputs/Goggle-3-LiveView-Windows-x64.zip --draft --title "${{ github.ref_name }}" --generate-notes
